name: 🐞 Bug report
description: Report a bug related to the WordPress plugin.
title: "[slymetrics] "
type: bug
assignees:
  - slydlake

body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please fill out the fields below.
        Important: The issue title should start with the plugin name in square brackets, e.g. `[slymetrics] Crash on startup`.

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version (optional)
      description: The slymetrics plugin version (e.g. `1.5.1`).
      placeholder: "1.5.1"
    validations:
      required: false

  - type: input
    id: wp_version
    attributes:
      label: WordPress / PHP version (optional)
      description: WordPress and PHP versions (e.g. `WP 6.5 / PHP 8.3`).
      placeholder: "WP 6.5 / PHP 8.3"
    validations:
      required: false

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: Describe how to reproduce the issue.
      placeholder: |
        1. Install the plugin
        2. Activate the plugin
        3. Observe error logs
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen.

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: What actually happened (include logs or error messages).

  - type: textarea
    id: configuration_files
    attributes:
      label: Configuration files (optional)
      description: Paste relevant parts of your configuration files here or provide a Gist/URL.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Relevant `wp-errors.log` entries or PHP error output.
